<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean White Squircle Badge with subtle border -->
  <rect x="14" y="14" width="484" height="484" rx="124" fill="#ffffff" stroke="#e2e8f0" stroke-width="14" filter="url(#shadow)"/>

  <!-- NFC Tap Waves Arching Above 'QR' -->
  <g fill="none" stroke="#ffb332" stroke-linecap="round" transform="translate(344, 150)">
    <path d="M 0 38 A 38 38 0 0 1 38 76" stroke-width="18"/>
    <path d="M 0 14 A 62 62 0 0 1 62 76" stroke-width="18"/>
    <path d="M 0 -10 A 86 86 0 0 1 86 76" stroke-width="18"/>
    <circle cx="2" cy="74" r="9" fill="#ffb332"/>
  </g>

  <!-- Exact TapQR Brand Wordmark matching Landing Page Header -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="252" y="306" font-size="144" font-weight="900" letter-spacing="-7">
      <tspan fill="#172029">Tap</tspan><tspan fill="#ffb332">QR</tspan>
    </text>
  </g>

  <!-- Amber brush smile/curve underline (from hero section design) -->
  <path d="M 96 348 C 165 372, 345 372, 416 348" fill="none" stroke="#ffb332" stroke-width="16" stroke-linecap="round"/>
</svg>